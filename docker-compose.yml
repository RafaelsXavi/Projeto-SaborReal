services:
  postgres:
    image: postgres:16-alpine
    container_name: saborreal-postgres
    environment:
      POSTGRES_DB: saborreal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saborreal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: saborreal-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saborreal-api
    environment:
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: info
      TRUST_PROXY: "false"
      CORS_ORIGINS: ""
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/saborreal
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: saborreal
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:

services:
  - type: web
    name: saborreal-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    repo: https://github.com/RafaelsXavi/Projeto-SaborReal
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Postgres externo gratuito (Neon); informar no painel
      - key: PG_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true  # Or paste the generated one
      - key: CORS_ORIGINS
        value: https://saborreal-web.onrender.com  # UPDATE para o dominio real do web
      - key: TRUST_PROXY
        value: 'true'
      - key: DEV_AUTH_ENABLED
        value: 'false'
      # Se o Postgres exigir TLS (comum em provedores):
      # - key: PG_SSL
      #   value: 'true'
    healthCheckPath: /healthz

  - type: web
    name: saborreal-web
    runtime: static
    repo: https://github.com/RafaelsXavi/Projeto-SaborReal
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://saborreal-api.onrender.com
    buildCommand: npm ci && npm -w @saborreal/web run build
    staticPublishPath: apps/web/dist
